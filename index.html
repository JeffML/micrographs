<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Photo Wall</title>
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        background: #111;
        font-family: system-ui, sans-serif;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
      }

      /* ── Editor toolbar ───────────────────────────────────── */
      #toolbar {
        width: 100%;
        background: #222;
        color: #bbb;
        padding: 8px 12px;
        display: none;
        align-items: center;
        gap: 10px;
        font-size: 13px;
      }
      #toolbar.visible {
        display: flex;
        flex-wrap: wrap;
      }
      #toolbar button {
        padding: 5px 12px;
        cursor: pointer;
        font-size: 13px;
      }

      /* ── Stage ────────────────────────────────────────────── */
      #stage {
        padding: 24px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
      }

      /* Hint text — shown only in viewer mode */
      #hint {
        color: #888;
        font-size: 13px;
        letter-spacing: 0.03em;
      }
      body.editing #hint {
        display: none;
      }

      /* Touch hint shown by default; swap to hover hint on real mouse devices */
      #hint-hover {
        display: none;
      }
      #hint-touch {
        display: inline;
      }
      @media (hover: hover) and (pointer: fine) {
        #hint-hover {
          display: inline;
        }
        #hint-touch {
          display: none;
        }
      }

      #container {
        position: relative;
        display: inline-block;
        line-height: 0;
      }

      #photo {
        display: block;
        max-width: 90vw;
        max-height: 85vh;
        user-select: none;
      }

      /* Draft rectangle drawn while creating a new hotspot */
      #draft {
        position: absolute;
        border: 2px dashed #fc0;
        background: rgba(255, 204, 0, 0.12);
        pointer-events: none;
        display: none;
      }

      /* ── Hotspot ──────────────────────────────────────────── */
      .hotspot {
        position: absolute;
        border: 2px solid transparent;
        border-radius: 3px;
      }

      /* Tooltip */
      .hotspot .tip {
        display: none;
        position: absolute;
        bottom: calc(100% + 10px);
        left: 50%;
        transform: translateX(-50%);
        background: rgba(20, 20, 20, 0.93);
        color: #f0f0f0;
        padding: 8px 14px;
        border-radius: 6px;
        font-size: 15px;
        font-weight: 500;
        line-height: 1.4;
        letter-spacing: 0.01em;
        white-space: nowrap;
        pointer-events: none;
        z-index: 50;
        box-shadow: 0 3px 10px rgba(0, 0, 0, 0.5);
        border: 1px solid rgba(255, 255, 255, 0.12);
      }
      .hotspot .tip::after {
        content: "";
        position: absolute;
        top: 100%;
        left: 50%;
        transform: translateX(-50%);
        border: 5px solid transparent;
        border-top-color: rgba(0, 0, 0, 0.88);
      }
      /* Show tooltip on hover in viewer mode only */
      body:not(.editing) .hotspot:hover .tip {
        display: block;
      }

      /* Resize handle (bottom-right corner) */
      .hotspot .rz {
        display: none;
        position: absolute;
        bottom: -5px;
        right: -5px;
        width: 12px;
        height: 12px;
        background: #fc0;
        border: 1px solid #000;
        cursor: se-resize;
        z-index: 3;
      }

      /* Delete button (top-right corner) */
      .hotspot .del {
        display: none;
        position: absolute;
        top: -8px;
        right: -8px;
        width: 16px;
        height: 16px;
        background: #e33;
        color: #fff;
        border: none;
        border-radius: 50%;
        font-size: 11px;
        line-height: 16px;
        text-align: center;
        cursor: pointer;
        z-index: 3;
        padding: 0;
      }

      /* Editor mode overrides */
      body.editing #container {
        cursor: crosshair;
      }
      body.editing .hotspot {
        border-color: rgba(255, 204, 0, 0.85);
        background: rgba(255, 204, 0, 0.08);
        cursor: move;
      }
      body.editing .hotspot .rz {
        display: block;
      }
      body.editing .hotspot .del {
        display: block;
      }

      /* ── Viewer mode hotspot ─────────────────────────────────── */
      body:not(.editing) .hotspot {
        cursor: pointer;
      }

      /* ── Popup overlay ───────────────────────────────────────── */
      #popup-overlay,
      #edit-overlay {
        display: none;
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.65);
        z-index: 100;
        align-items: center;
        justify-content: center;
      }
      #popup-overlay.open,
      #edit-overlay.open {
        display: flex;
      }
      .popup-box {
        background: #1e1e1e;
        color: #e8e8e8;
        border-radius: 10px;
        padding: 24px 28px;
        max-width: 420px;
        width: 90vw;
        position: relative;
        box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
        border: 1px solid rgba(255, 255, 255, 0.1);
      }
      .popup-close {
        position: absolute;
        top: 10px;
        right: 14px;
        background: none;
        border: none;
        color: #aaa;
        font-size: 22px;
        cursor: pointer;
        line-height: 1;
        padding: 0;
      }
      .popup-close:hover {
        color: #fff;
      }
      .popup-field {
        margin-bottom: 10px;
      }
      .popup-field .label {
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #888;
        margin-bottom: 3px;
      }
      .popup-field .value {
        font-size: 15px;
        color: #e0e0e0;
      }
      .popup-price {
        font-size: 20px;
        font-weight: 600;
        color: #fc0;
        margin-top: 14px;
      }
      /* Edit modal form */
      .edit-form label {
        display: flex;
        flex-direction: column;
        margin-bottom: 12px;
        font-size: 11px;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        color: #999;
        gap: 4px;
      }
      .edit-form input,
      .edit-form textarea {
        background: #2a2a2a;
        border: 1px solid #444;
        border-radius: 4px;
        color: #e0e0e0;
        font-size: 14px;
        padding: 6px 10px;
        font-family: inherit;
        text-transform: none;
        letter-spacing: normal;
      }
      .edit-form textarea {
        resize: vertical;
        min-height: 60px;
      }
      .edit-form input:focus,
      .edit-form textarea:focus {
        outline: none;
        border-color: #fc0;
      }
      .edit-buttons {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
        margin-top: 6px;
      }
      .edit-buttons button {
        padding: 6px 18px;
        border-radius: 4px;
        cursor: pointer;
        font-size: 13px;
        border: none;
      }
      #ef-cancel {
        background: #333;
        color: #ccc;
      }
      #ef-save {
        background: #fc0;
        color: #000;
        font-weight: 600;
      }

      /* ── Footer ──────────────────────────────────────────────── */
      #footer {
        color: #555;
        font-size: 12px;
        letter-spacing: 0.04em;
        padding: 16px 0 20px;
        text-align: center;
        width: 100%;
      }
    </style>
  </head>
  <body>
    <div id="toolbar">
      <button id="btn-save">Save</button>
      <button id="btn-upload">Upload Photo</button>
      <input id="file-input" type="file" accept="image/*" style="display: none" />
      <button id="btn-exit">Exit Editor</button>
      <span
        >Drag empty area to add &nbsp;·&nbsp; Drag hotspot to move &nbsp;·&nbsp; Corner handle to resize &nbsp;·&nbsp;
        Click hotspot to edit &nbsp;·&nbsp; × to delete</span
      >
    </div>

    <div id="stage">
      <div id="container">
        <img id="photo" src="/api/image" alt="Framed photographs" draggable="false" />
        <div id="draft"></div>
      </div>
      <p id="hint">
        <span id="hint-hover">Hover over any photograph for more info &nbsp;·&nbsp; Click for details</span>
        <span id="hint-touch">Tap any photograph for more info</span>
      </p>
    </div>

    <footer id="footer"></footer>

    <!-- Viewer popup -->
    <div id="popup-overlay">
      <div class="popup-box">
        <button class="popup-close" id="popup-close">×</button>
        <div id="popup-body"></div>
      </div>
    </div>

    <!-- Editor modal -->
    <div id="edit-overlay">
      <div class="popup-box edit-form">
        <button class="popup-close" id="ef-cancel-x">×</button>
        <h3 style="margin-bottom: 16px; font-weight: 500; font-size: 16px; color: #ccc">Edit Hotspot</h3>
        <label>Hover label<input id="ef-tooltip" type="text" /></label>
        <label>Subject<input id="ef-subject" type="text" /></label>
        <label>Magnification<input id="ef-magnification" type="text" /></label>
        <label
          >Lighting <small style="text-transform: none; letter-spacing: normal; color: #666">(comma-separated)</small
          ><input id="ef-lighting" type="text"
        /></label>
        <label
          >Tags <small style="text-transform: none; letter-spacing: normal; color: #666">(comma-separated)</small
          ><input id="ef-tags" type="text"
        /></label>
        <label>Notes<textarea id="ef-notes"></textarea></label>
        <label>Price<input id="ef-price" type="text" placeholder="e.g. $250" /></label>
        <label>Link URL<input id="ef-link" type="text" placeholder="e.g. statement.html" /></label>
        <div class="edit-buttons">
          <button id="ef-cancel">Discard</button>
          <button id="ef-save">Apply</button>
        </div>
      </div>
    </div>

    <script>
      let hotspots = [];
      let editing = false;
      let editorPassword = null;
      let dirty = false;

      function markDirty() {
        dirty = true;
      }
      function clearDirty() {
        dirty = false;
      }

      const container = document.getElementById("container");
      const draft = document.getElementById("draft");
      const btnSave = document.getElementById("btn-save");
      const btnUpload = document.getElementById("btn-upload");
      const fileInput = document.getElementById("file-input");
      const btnExit = document.getElementById("btn-exit");
      const toolbar = document.getElementById("toolbar");
      const photo = document.getElementById("photo");

      // ── Unsaved changes warning on page unload ─────────────────
      window.addEventListener("beforeunload", (e) => {
        if (editing && dirty) {
          e.preventDefault();
          e.returnValue = "";
        }
      });

      // ── Footer copyright ──────────────────────────────────────
      document.getElementById("footer").textContent = `© ${new Date().getFullYear()} Jeff Lowery · All rights reserved`;

      // ── Load ────────────────────────────────────────────────────
      fetch("/api/hotspots")
        .then((r) => r.json())
        .then((data) => {
          hotspots = data;
          render();
        })
        .catch(() => {
          hotspots = [];
        });

      // ── Editor toggle ───────────────────────────────────────────
      function setEditing(on) {
        if (!on && dirty) {
          if (!confirm("You have unsaved changes. Exit without saving?")) return;
        }
        editing = on;
        if (!on) clearDirty();
        document.body.classList.toggle("editing", on);
        toolbar.classList.toggle("visible", on);
      }

      async function tryEnterEditor() {
        const pw = prompt("Editor password:");
        if (!pw) return;
        try {
          const res = await fetch("/api/hotspots", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: pw, validate: true }),
          });
          if (res.ok) {
            editorPassword = pw;
            setEditing(true);
          } else {
            alert("Incorrect password.");
          }
        } catch {
          alert("Network error. Could not validate password.");
        }
      }

      btnExit.addEventListener("click", () => setEditing(false));

      // ── Upload photo ──────────────────────────────────────────
      btnUpload.addEventListener("click", () => fileInput.click());

      fileInput.addEventListener("change", async () => {
        const file = fileInput.files[0];
        if (!file) return;
        btnUpload.textContent = "Uploading…";
        btnUpload.disabled = true;
        try {
          const res = await fetch("/api/image", {
            method: "POST",
            headers: {
              "Content-Type": file.type || "image/jpeg",
              "x-editor-password": editorPassword,
            },
            body: file,
          });
          if (res.ok) {
            // Reload image without refreshing the page
            photo.src = "/api/image?t=" + Date.now();
            btnUpload.textContent = "Uploaded!";
            setTimeout(() => {
              btnUpload.textContent = "Upload Photo";
              btnUpload.disabled = false;
            }, 2000);
          } else if (res.status === 401) {
            alert("Incorrect password.");
            editorPassword = null;
            setEditing(false);
            btnUpload.textContent = "Upload Photo";
            btnUpload.disabled = false;
          } else {
            alert("Upload failed. Please try again.");
            btnUpload.textContent = "Upload Photo";
            btnUpload.disabled = false;
          }
        } catch {
          alert("Network error. Please try again.");
          btnUpload.textContent = "Upload Photo";
          btnUpload.disabled = false;
        }
        fileInput.value = "";
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") {
          if (document.getElementById("edit-overlay").classList.contains("open")) {
            closeEditModal();
          } else if (document.getElementById("popup-overlay").classList.contains("open")) {
            closePopup();
          } else if (editing) {
            setEditing(false);
          }
          return;
        }
        if ((e.key === "e" || e.key === "E") && e.shiftKey && e.altKey && !editing) tryEnterEditor();
      });

      // ── 5-tap trigger (mobile) ───────────────────────────────────
      let tapCount = 0,
        tapTimer = null;
      document.addEventListener("touchend", () => {
        if (editing) return;
        tapCount++;
        clearTimeout(tapTimer);
        tapTimer = setTimeout(() => {
          tapCount = 0;
        }, 1000);
        if (tapCount >= 5) {
          tapCount = 0;
          clearTimeout(tapTimer);
          tryEnterEditor();
        }
      });

      // ── Render ──────────────────────────────────────────────────
      function render() {
        document.querySelectorAll(".hotspot").forEach((el) => el.remove());
        hotspots.forEach((hs, i) => makeHotspot(hs, i));
      }

      function applyPos(el, hs) {
        el.style.left = hs.x + "%";
        el.style.top = hs.y + "%";
        el.style.width = hs.w + "%";
        el.style.height = hs.h + "%";
      }

      function makeHotspot(hs, i) {
        const el = document.createElement("div");
        el.className = "hotspot";

        const tip = document.createElement("div");
        tip.className = "tip";
        tip.textContent = hs.tooltip;
        el.appendChild(tip);

        const rz = document.createElement("div");
        rz.className = "rz";
        el.appendChild(rz);

        const del = document.createElement("button");
        del.className = "del";
        del.textContent = "×";
        del.title = "Delete hotspot";
        el.appendChild(del);

        applyPos(el, hs);
        container.insertBefore(el, draft);

        // ── Move (mouse + touch) ──
        function beginMove(startX, startY) {
          const cRect = container.getBoundingClientRect();
          const ox = startX,
            oy = startY;
          const ox_pct = hs.x,
            oy_pct = hs.y;
          let moved = false;
          function doMove(cx, cy) {
            moved = true;
            hs.x = clamp(ox_pct + ((cx - ox) / cRect.width) * 100, 0, 100 - hs.w);
            hs.y = clamp(oy_pct + ((cy - oy) / cRect.height) * 100, 0, 100 - hs.h);
            applyPos(el, hs);
            markDirty();
          }
          function doEnd() {
            if (!moved) openEditModal(hs);
          }
          return { doMove, doEnd };
        }

        el.addEventListener("mousedown", (e) => {
          if (!editing || e.target === rz || e.target === del) return;
          e.stopPropagation();
          const { doMove, doEnd } = beginMove(e.clientX, e.clientY);
          function mm(e) {
            doMove(e.clientX, e.clientY);
          }
          function mu() {
            document.removeEventListener("mousemove", mm);
            document.removeEventListener("mouseup", mu);
            doEnd();
          }
          document.addEventListener("mousemove", mm);
          document.addEventListener("mouseup", mu);
        });

        el.addEventListener(
          "touchstart",
          (e) => {
            if (!editing || e.target === rz || e.target === del) return;
            e.stopPropagation();
            e.preventDefault();
            const t = e.touches[0];
            const { doMove, doEnd } = beginMove(t.clientX, t.clientY);
            function tm(e) {
              const t = e.touches[0];
              doMove(t.clientX, t.clientY);
            }
            function tu() {
              document.removeEventListener("touchmove", tm);
              document.removeEventListener("touchend", tu);
              doEnd();
            }
            document.addEventListener("touchmove", tm, { passive: false });
            document.addEventListener("touchend", tu);
          },
          { passive: false },
        );

        // Viewer mode click → follow link or open popup
        el.addEventListener("click", (e) => {
          if (editing) return;
          if (hs.link) {
            window.location.href = hs.link;
            return;
          }
          openViewerPopup(hs);
        });

        // ── Resize (mouse + touch) ──
        function beginResize(startX, startY) {
          const cRect = container.getBoundingClientRect();
          const ox = startX,
            oy = startY,
            ow = hs.w,
            oh = hs.h;
          function doMove(cx, cy) {
            hs.w = Math.max(2, ow + ((cx - ox) / cRect.width) * 100);
            hs.h = Math.max(2, oh + ((cy - oy) / cRect.height) * 100);
            applyPos(el, hs);
            markDirty();
          }
          return { doMove };
        }

        rz.addEventListener("mousedown", (e) => {
          if (!editing) return;
          e.stopPropagation();
          const { doMove } = beginResize(e.clientX, e.clientY);
          function mm(e) {
            doMove(e.clientX, e.clientY);
          }
          function mu() {
            document.removeEventListener("mousemove", mm);
            document.removeEventListener("mouseup", mu);
          }
          document.addEventListener("mousemove", mm);
          document.addEventListener("mouseup", mu);
        });

        rz.addEventListener(
          "touchstart",
          (e) => {
            if (!editing) return;
            e.stopPropagation();
            e.preventDefault();
            const t = e.touches[0];
            const { doMove } = beginResize(t.clientX, t.clientY);
            function tm(e) {
              const t = e.touches[0];
              doMove(t.clientX, t.clientY);
            }
            function tu() {
              document.removeEventListener("touchmove", tm);
              document.removeEventListener("touchend", tu);
            }
            document.addEventListener("touchmove", tm, { passive: false });
            document.addEventListener("touchend", tu);
          },
          { passive: false },
        );

        // ── Delete ──
        del.addEventListener("click", (e) => {
          e.stopPropagation();
          hotspots.splice(i, 1);
          markDirty();
          render();
        });
      }

      // ── Draw new hotspot (mouse + touch) ──────────────────────
      let drawing = false,
        drawStart = {};

      function beginDraw(clientX, clientY) {
        const cRect = container.getBoundingClientRect();
        drawStart = {
          x: ((clientX - cRect.left) / cRect.width) * 100,
          y: ((clientY - cRect.top) / cRect.height) * 100,
        };
        drawing = true;
        draft.style.display = "block";
        draft.style.left = drawStart.x + "%";
        draft.style.top = drawStart.y + "%";
        draft.style.width = "0";
        draft.style.height = "0";
      }

      function moveDraw(clientX, clientY) {
        if (!drawing) return;
        const cRect = container.getBoundingClientRect();
        const cx = ((clientX - cRect.left) / cRect.width) * 100;
        const cy = ((clientY - cRect.top) / cRect.height) * 100;
        const rect = getDraftRect(cx, cy);
        draft.style.left = rect.x + "%";
        draft.style.top = rect.y + "%";
        draft.style.width = rect.w + "%";
        draft.style.height = rect.h + "%";
      }

      function endDraw(clientX, clientY) {
        if (!drawing) return;
        drawing = false;
        draft.style.display = "none";
        const cRect = container.getBoundingClientRect();
        const cx = ((clientX - cRect.left) / cRect.width) * 100;
        const cy = ((clientY - cRect.top) / cRect.height) * 100;
        const rect = getDraftRect(cx, cy);
        if (rect.w < 1 || rect.h < 1) return;
        const hs = {
          x: round(rect.x),
          y: round(rect.y),
          w: round(rect.w),
          h: round(rect.h),
          tooltip: "",
          subject: "",
          magnification: "",
          lighting: [],
          tags: [],
          notes: "",
          price: "",
          link: "",
        };
        hotspots.push(hs);
        markDirty();
        render();
        openEditModal(hs);
      }

      container.addEventListener("mousedown", (e) => {
        if (!editing || e.target.closest(".hotspot")) return;
        e.preventDefault();
        beginDraw(e.clientX, e.clientY);
      });
      document.addEventListener("mousemove", (e) => {
        moveDraw(e.clientX, e.clientY);
      });
      document.addEventListener("mouseup", (e) => {
        endDraw(e.clientX, e.clientY);
      });

      container.addEventListener(
        "touchstart",
        (e) => {
          if (!editing || e.target.closest(".hotspot")) return;
          e.preventDefault();
          const t = e.touches[0];
          beginDraw(t.clientX, t.clientY);
        },
        { passive: false },
      );
      document.addEventListener(
        "touchmove",
        (e) => {
          if (!drawing) return;
          e.preventDefault();
          const t = e.touches[0];
          moveDraw(t.clientX, t.clientY);
        },
        { passive: false },
      );
      document.addEventListener("touchend", (e) => {
        if (!drawing) return;
        const t = e.changedTouches[0];
        endDraw(t.clientX, t.clientY);
      });

      function getDraftRect(cx, cy) {
        return {
          x: Math.min(drawStart.x, cx),
          y: Math.min(drawStart.y, cy),
          w: Math.abs(cx - drawStart.x),
          h: Math.abs(cy - drawStart.y),
        };
      }

      // ── Save ─────────────────────────────────────────────────────
      btnSave.addEventListener("click", async () => {
        if (!dirty) return;
        const clean = hotspots.map((hs) => ({
          x: round(hs.x),
          y: round(hs.y),
          w: round(hs.w),
          h: round(hs.h),
          tooltip: hs.tooltip || "",
          subject: hs.subject || "",
          magnification: hs.magnification || "",
          lighting: hs.lighting || [],
          tags: hs.tags || [],
          notes: hs.notes || "",
          price: hs.price || "",
          link: hs.link || "",
        }));
        btnSave.textContent = "Saving…";
        btnSave.disabled = true;
        try {
          const res = await fetch("/api/hotspots", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ password: editorPassword, hotspots: clean }),
          });
          if (res.ok) {
            btnSave.textContent = "Saved!";
            clearDirty();
            setTimeout(() => {
              btnSave.textContent = "Save";
              btnSave.disabled = false;
            }, 2000);
          } else if (res.status === 401) {
            alert("Incorrect password — edits not saved.");
            editorPassword = null;
            setEditing(false);
            btnSave.textContent = "Save";
            btnSave.disabled = false;
          } else {
            alert("Save failed. Please try again.");
            btnSave.textContent = "Save";
            btnSave.disabled = false;
          }
        } catch {
          alert("Network error. Please try again.");
          btnSave.textContent = "Save";
          btnSave.disabled = false;
        }
      });

      // ── Helpers ─────────────────────────────────────────────────
      function clamp(v, lo, hi) {
        return Math.min(Math.max(v, lo), hi);
      }
      function round(v) {
        return Math.round(v * 1000) / 1000;
      }

      // ── Viewer popup ──────────────────────────────────────────────
      const popupOverlay = document.getElementById("popup-overlay");
      const popupBody = document.getElementById("popup-body");
      document.getElementById("popup-close").addEventListener("click", closePopup);
      popupOverlay.addEventListener("click", (e) => {
        if (e.target === popupOverlay) closePopup();
      });
      function closePopup() {
        popupOverlay.classList.remove("open");
      }

      function openViewerPopup(hs) {
        const fields = [
          { label: "Subject", value: hs.subject },
          { label: "Magnification", value: hs.magnification },
          {
            label: "Lighting",
            value: Array.isArray(hs.lighting) ? hs.lighting.join(", ") : hs.lighting,
          },
          {
            label: "Tags",
            value: Array.isArray(hs.tags) ? hs.tags.join(", ") : hs.tags,
          },
          { label: "Notes", value: hs.notes },
        ];
        let html = "";
        for (const f of fields) {
          if (!f.value) continue;
          html += `<div class="popup-field"><div class="label">${f.label}</div><div class="value">${escHtml(String(f.value))}</div></div>`;
        }
        if (hs.price) {
          html += `<div class="popup-price">${escHtml(hs.price)}</div>`;
        }
        if (!html) html = '<div style="color:#888;font-style:italic">No details yet.</div>';
        popupBody.innerHTML = html;
        popupOverlay.classList.add("open");
      }

      function escHtml(s) {
        return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }

      // ── Edit modal ────────────────────────────────────────────────
      const editOverlay = document.getElementById("edit-overlay");
      const efTooltip = document.getElementById("ef-tooltip");
      const efSubject = document.getElementById("ef-subject");
      const efMagnification = document.getElementById("ef-magnification");
      const efLighting = document.getElementById("ef-lighting");
      const efTags = document.getElementById("ef-tags");
      const efNotes = document.getElementById("ef-notes");
      const efPrice = document.getElementById("ef-price");
      const efLink = document.getElementById("ef-link");
      const efSave = document.getElementById("ef-save");
      const efCancel = document.getElementById("ef-cancel");
      const efCancelX = document.getElementById("ef-cancel-x");
      editOverlay.addEventListener("click", (e) => {
        if (e.target === editOverlay) closeEditModal();
      });

      function openEditModal(hs) {
        efTooltip.value = hs.tooltip || "";
        efSubject.value = hs.subject || "";
        efMagnification.value = hs.magnification || "";
        efLighting.value = Array.isArray(hs.lighting) ? hs.lighting.join(", ") : hs.lighting || "";
        efTags.value = Array.isArray(hs.tags) ? hs.tags.join(", ") : hs.tags || "";
        efNotes.value = hs.notes || "";
        efPrice.value = hs.price || "";
        efLink.value = hs.link || "";
        editOverlay.classList.add("open");
        efSubject.focus();

        function doSave() {
          hs.tooltip = efTooltip.value.trim();
          hs.subject = efSubject.value.trim();
          hs.magnification = efMagnification.value.trim();
          hs.lighting = efLighting.value
            .split(",")
            .map((s) => s.trim())
            .filter(Boolean);
          hs.tags = efTags.value
            .split(",")
            .map((s) => s.trim())
            .filter(Boolean);
          hs.notes = efNotes.value.trim();
          hs.price = efPrice.value.trim();
          hs.link = efLink.value.trim();
          markDirty();
          closeEditModal();
          render();
        }

        function doCancel() {
          closeEditModal();
        }

        efSave.onclick = doSave;
        efCancel.onclick = doCancel;
        efCancelX.onclick = doCancel;
      }

      function closeEditModal() {
        editOverlay.classList.remove("open");
        efSave.onclick = null;
        efCancel.onclick = null;
        efCancelX.onclick = null;
      }
    </script>
  </body>
</html>
